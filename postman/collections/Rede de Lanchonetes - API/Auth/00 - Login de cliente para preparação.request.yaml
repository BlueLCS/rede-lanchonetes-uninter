$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "cliente@exemplo.com",
      "senha": "Senha123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login do cliente realizado", function () {
        pm.response.to.have.status(200);
      });

      const response = pm.response.json();
      pm.collectionVariables.set("clienteToken", response.accessToken);
      pm.collectionVariables.set("clienteRefreshToken", response.refreshToken);
    language: text/javascript
order: 2000
