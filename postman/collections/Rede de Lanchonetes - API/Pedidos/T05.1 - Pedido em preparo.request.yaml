$kind: http-request
url: "{{baseUrl}}/pedidos/{{pedidoId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "EM_PREPARO"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("T05.1 - Status HTTP 200", function () {
        pm.response.to.have.status(200);
      });
      const response = pm.response.json();
      pm.test("T05.1 - Pedido em preparo", function () {
        pm.expect(response.status).to.eql("EM_PREPARO");
      });
    language: text/javascript
order: 3000
