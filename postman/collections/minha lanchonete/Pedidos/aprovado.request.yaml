    code: "pm.test(\"T03 - Status 201\", function () {\r

      \  pm.response.to.have.status(201);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"T03 - Pedido aprovado\", function () {\r

      \  pm.expect(response.status).to.eql(\r

      \    \"PAGAMENTO_APROVADO\"\r

      \  );\r

      \r

      \  pm.expect(response.canalPedido).to.eql(\"TOTEM\");\r

      });\r

      \r

      pm.collectionVariables.set(\r

      \  \"pedidoId\",\r

      \  response.id\r

      );"
