$kind: http-request
description: ""
url: http://localhost:3000/unidades/{{unidadeId}}/cardapio
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"T02 - Status 200\", function () {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"T02 - Cardápio possui produtos\", function () {\r

      \  pm.expect(response.items).to.be.an(\"array\");\r

      \  pm.expect(response.items.length).to.be.above(0);\r

      });\r

      \r

      const firstProduct = response.items[0];\r

      \r

      pm.collectionVariables.set(\r

      \  \"produtoId\",\r

      \  firstProduct.produtoId\r

      );\r

      \r

      const deniedProduct =\r

      \  response.items.find(function (product) {\r

      \    return product.nome === \"X-Burger\";\r

      \  }) || firstProduct;\r

      \r

      pm.collectionVariables.set(\r

      \  \"produtoPagamentoNegadoId\",\r

      \  deniedProduct.produtoId\r

      );"
    language: text/javascript
order: 1786323762475
